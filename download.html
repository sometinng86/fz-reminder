<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用下载引导</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(168deg, #00237e, #0a4fe0); color: #fff; }
  .card { max-width: 420px; width: 88%; text-align: center; padding: 40px 26px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; backdrop-filter: blur(8px); }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 2px; }
  p { font-size: 14px; line-height: 1.9; color: #dbeafe; margin: 6px 0; }
  .ios-btn { display: inline-block; margin-top: 18px; padding: 12px 30px; border-radius: 999px; background: #fff; color: #0a4fe0; font-weight: 700; text-decoration: none; letter-spacing: 1px; }
  .note { margin-top: 16px; font-size: 12px; color: rgba(219,234,254,.7); }
  #ios { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>应用下载引导</h1>
  <p>请前往手机<strong>应用商店</strong>（应用宝、华为应用市场、小米应用商店、苹果 App Store 等）<br>搜索「国家反诈中心」下载安装</p>
  <div id="ios">
    <a class="ios-btn" href="https://apps.apple.com/cn/app/id1552823102">前往 App Store</a>
  </div>
  <p class="note">已安装的请直接打开使用 · 谨防陌生链接</p>
</div>
<script>
(function () {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/i.test(ua)) {
    document.getElementById("ios").style.display = "block";
  }
})();
</script>
</body>
</html>
