<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家反诈中心提醒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(165deg, #002f8f 0%, #0040c0 45%, #1a56db 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
  }
  /* 背景光晕 */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .25;
  }
  body::before { width: 340px; height: 340px; background: #3b82f6; top: -120px; right: -100px; }
  body::after  { width: 300px; height: 300px; background: #60a5fa; bottom: -110px; left: -90px; }

  .shield {
    width: 96px; height: 96px;
    position: relative;
    margin-bottom: 22px;
  }
  .shield img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  .badge {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #dbeafe;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow: 0 4px 16px rgba(0,0,0,.25);
    margin-bottom: 10px;
    text-align: center;
    white-space: nowrap;
  }
  .slogan {
    font-size: 19px;
    font-weight: 600;
    color: #bfdbfe;
    letter-spacing: 2px;
    margin-bottom: 34px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px;
    padding: 26px 38px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    margin-bottom: 30px;
  }
  .card .label {
    font-size: 14px;
    color: #bfdbfe;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .card .num {
    font-size: 52px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #fff, #93c5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }
  .card .unit {
    font-size: 15px;
    color: #dbeafe;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .tips {
    font-size: 14px;
    color: rgba(255,255,255,.75);
    line-height: 1.9;
    text-align: center;
    max-width: 320px;
    margin-bottom: 26px;
  }
  .tips b { color: #fbbf24; font-weight: 700; }
  .footer {
    font-size: 12px;
    color: rgba(255,255,255,.5);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="shield">
    <img src="assets/logo.png" alt="国家反诈中心徽章">
  </div>

  <div class="badge">国家反诈中心 · 官方提醒</div>
  <h1>陌生二维码 不要乱扫！</h1>
  <div class="slogan">不明链接不点击 · 陌生码不识别 · 验证码不透露</div>

  <div class="card">
    <div class="label">已收到本提醒</div>
    <div class="num" id="count">--</div>
    <div class="unit">人（每扫码一次 +1）</div>
  </div>

  <div class="tips">
    骗子常把木马链接、钓鱼网站伪装成二维码，<br>
    扫一下<b>钱袋子</b>就可能被掏空。<br>
    如遇可疑，请拨打 <b>96110</b> 反诈专线咨询。
  </div>

  <div class="footer">国家反诈中心 · 公安部刑事侦查局<br>谨防电信网络诈骗，守护你的钱袋子</div>

<script>
(function () {
  var BASE = 1258;            // 起始数
  var KEY = "fz-reminder-scan";
  var el = document.getElementById("count");

  function show(n) {
    el.textContent = n.toLocaleString("zh-CN");
  }

  function fmt(n) {
    return (BASE + n).toLocaleString("zh-CN");
  }

  // 首选：真实全局计数 API（counterapi.dev）
  fetch("https://api.counterapi.dev/v1/fz-reminder/scan/up", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && typeof d.count === "number") show(fmt(d.count));
    })
    .catch(function () {
      // 降级：本地计数（每台设备各自累计，至少数字会动）
      try {
        var v = parseInt(localStorage.getItem(KEY) || "0", 10) + 1;
        localStorage.setItem(KEY, String(v));
        show(fmt(v));
      } catch (e) {
        show("1,259");
      }
    });
})();
</script>
</body>
</html>
